<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa de Recolecciones - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
     <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="recolections-header">
            <div id="recolections-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-pin-map" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M3.1 11.2a.5.5 0 0 1 .4-.2H6a.5.5 0 0 1 0 1H3.75L1.5 15h13l-2.25-3H10a.5.5 0 0 1 0-1h2.5a.5.5 0 0 1 .4.2l3 4a.5.5 0 0 1-.4.8H.5a.5.5 0 0 1-.4-.8z"/>
                                <path fill-rule="evenodd" d="M8 1a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 4a4 4 0 1 1 4.5 3.969V13.5a.5.5 0 0 1-1 0V7.97A4 4 0 0 1 4 3.999z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Planeación de Recolecciones</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-recolection" class="btn btn-primary d-flex align-items-center d-none" data-comp-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Nueva Recolección</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="recolections-form">
            
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="recolections-filter pt-3 pb-3">
            <div id="recolections-filter-container" class="container pt-4 pb-3">
                <div class="d-flex align-items-center ms-4 mb-4">
                    <h5 id="weekHeader">Semana -</h5>
                </div>
                <div class="row ms-2 me-2">
                    <div class="col-lg-3 col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="day-filter" class="form-label m-2">Filtrar por Día</label>
                        <input type="text" id="day-filter" class="form-control" placeholder="Fecha a mostrar">
                    </div>
                    <div class="col-lg-3 col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="supplier-filter" class="form-label m-2">Filtrar por Proveedor</label>
                        <select class="form-select" id="supplier-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="recolections-register" class="pb-4">
            <div id="recolections-table-container" class="container table-responsive p-0">
                <table id="recolections-table" class="table table-hover">
                    <thead>
                        <tr class="table-light">
                            <th class="p-3 ps-4">FECHA</th>
                            <th class="p-3 ps-2">PROVEEDOR</th>
                            <th class="p-3 ps-2">PLANEADO</th>
                            <th class="p-3 ps-2">RECOLECTADO</th>
                            <th class="text-center p-3">ESTADO</th>
                            <th class="p-3 ps-2">UBICACIÓN</th>
                            <th class="text-center p-3 d-none" data-comp-only>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Actualizar estado de recolección</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="recolection-edit-form">
                            <input type="hidden" id="edit-id-recolection">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 ms-auto label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control block-field" id="edit-date">
                                    <p class="error invalid-feedback" id="error-editDate" style="color: red;"></p>
                                </div>
                            </div>
                            <!-- Campos editables -->
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-12 col-lg-6 label-over-border">
                                    <label for="edit-supplier" class="form-label m-2">Proveedor</label>
                                    <input type="text" class="form-control" id="edit-supplier" disabled>
                                </div>
                                <div class="col-md-12 col-lg-6 label-over-border filter">
                                    <label for="edit-destination" class="form-label m-2">Destino</label>
                                    <input type="text" class="form-control block-field" id="edit-destination">
                                    <p class="error invalid-feedback" id="error-editDestination" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-8 label-over-border">
                                    <label for="edit-observations" class="form-label m-2">Observaciones</label>
                                    <input type="text" class="form-control block-field" id="edit-observations">
                                    <p class="error invalid-feedback" id="error-editObservations" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select block-field" aria-label="Default select example">
                                        <option value="Pendiente">Seleccione..</option>
                                        <option value="Planeado">Planeado</option>
                                        <option value="Asignado" class="d-none">Asignado</option>
                                        <option value="En ruta" class="d-none">En ruta</option>
                                        <option value="Recolectado" class="d-none">Recolectado</option>
                                        <option value="Cancelado">Cancelado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="recolection-products">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col d-flex align-items-center">
                                    <p class="fw-bold">Productos asignados</p>
                                </div>
                                <div class="col-6 col-md-5 col-lg-3 d-flex align-items-center justify-content-end">
                                    <button id="btn-add-product" type="button" class="btn btn-sm btn-primary d-none">+ Agregar Producto</button>
                                </div>
                            </div>
                            <div id="recolection-products-container" class="mb-4">

                            </div>
                        </div>
                        <div id="recolected-products" class="d-none">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col d-flex align-items-center">
                                    <p class="fw-bold">Productos recolectados</p>
                                </div>
                            </div>
                            <div id="recolected-products-container" class="mb-4">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-entry">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/recolections.js"></script>
</body>
</html>
