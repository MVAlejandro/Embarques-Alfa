<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa de Embarques - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
     <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="shipments-header">
            <div id="shipments-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-box-seam" viewBox="0 0 16 16">
                                <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Planeación de Embarques</h4>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="shipments-filter pt-3 pb-3">
            <div id="shipments-filter-container" class="container pt-4 pb-3">
                <div class="d-flex align-items-center ms-4 mb-4">
                    <h5 id="weekHeader">Semana -</h5>
                </div>
                <div class="row ms-2 me-2">
                    <div class="col-md-3 d-flex align-items-center label-over-border">
                        <label for="day-filter" class="form-label m-2">Filtrar por Día</label>
                        <input type="text" id="day-filter" class="form-control" placeholder="Fecha a mostrar" autocomplete="off">
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                        <button id="save-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3 ms-2 d-none" disabled data-coor-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-floppy" viewBox="0 0 16 16">
                                <path d="M11 2H9v3h2z"/>
                                <path d="M1.5 0h11.586a1.5 1.5 0 0 1 1.06.44l1.415 1.414A1.5 1.5 0 0 1 16 2.914V14.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 14.5v-13A1.5 1.5 0 0 1 1.5 0M1 1.5v13a.5.5 0 0 0 .5.5H2v-4.5A1.5 1.5 0 0 1 3.5 9h9a1.5 1.5 0 0 1 1.5 1.5V15h.5a.5.5 0 0 0 .5-.5V2.914a.5.5 0 0 0-.146-.353l-1.415-1.415A.5.5 0 0 0 13.086 1H13v4.5A1.5 1.5 0 0 1 11.5 7h-7A1.5 1.5 0 0 1 3 5.5V1H1.5a.5.5 0 0 0-.5.5m3 4a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5V1H4zM3 15h10v-4.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5z"/>
                            </svg>
                            <p class="ps-2">Guardar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="shipments-register" class="pb-4">
            <div id="shipments-table-container" class="container table-responsive p-0">
                <table id="shipments-table" class="table table-hover">
                    <thead>
                        <tr class="table-light">
                            <th class="text-center px-3 py-2">ORDEN</th>
                            <th class="px-3 py-2">HORA</th>
                            <th class="px-3 py-2">CLIENTE</th>
                            <th class="px-3 py-2">SOLICITADO / EMBARCADO</th>
                            <th class="text-center px-3 py-2">EMBARQUE</th>
                            <th class="px-3 py-2">UNIDAD</th>
                            <th class="px-3 py-2">OBSERVACIONES</th>
                            <th class="text-center px-3 py-2 d-none" data-prod-only data-coor-only>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Actualizar orden de compra</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="shipment-edit-form">
                            <input type="hidden" id="edit-id-partition">
                            <input type="hidden" id="edit-id-order">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 col-lg-3 label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control" id="edit-date" disabled>
                                </div>
                                <div class="col-md-4 col-lg-3 ms-auto label-over-border">
                                    <label for="edit-time" class="form-label m-2">Hora planeada</label>
                                    <input type="time" class="form-control" id="edit-time" disabled data-prod-only data-coor-only>
                                    <p class="error invalid-feedback" id="error-editTime" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 col-lg-3 label-over-border">
                                    <label for="edit-real-time" class="form-label m-2">Hora embarcado</label>
                                    <input type="time" class="form-control" id="edit-real-time" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-travel" class="form-label m-2">Tiempo de Traslado</label>
                                    <input type="text" class="form-control" id="edit-travel" placeholder="HH:MM" disabled>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-receptionSt" class="form-label m-2">Hora Recepción Inicio</label>
                                    <input type="time" class="form-control" id="edit-receptionSt" disabled>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-receptionEn" class="form-label m-2">Hora Recepción Fin</label>
                                    <input type="time" class="form-control" id="edit-receptionEn" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-oc" class="form-label m-2">Orden de compra</label>
                                    <input type="text" class="form-control" id="edit-oc" disabled>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-destination" class="form-label m-2">Destino</label>
                                    <input type="text" class="form-control" id="edit-destination" disabled>
                                    <p class="error invalid-feedback" id="error-editDestination" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-remision" class="form-label m-2">Número de remisión</label>
                                    <input type="text" class="form-control" id="edit-remision" placeholder="000000">
                                    <p class="error invalid-feedback" id="error-editRemision" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="Planeado">Seleccione...</option>
                                        <option value="Preparando">Preparando</option>
                                        <option value="En carga">En carga</option>
                                        <option value="Cargado">Cargado</option>
                                        <option value="Proyectado" class="d-none">Proyectado</option>
                                        <option value="Cancelado" class="d-none">Cancelado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col label-over-border">
                                    <label for="edit-observations" class="form-label m-2">Observaciones</label>
                                    <input type="text" class="form-control" id="edit-observations">
                                    <p class="error invalid-feedback" id="error-editObservations" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="partition-products">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col d-flex align-items-center">
                                    <p class="fw-bold">Productos solicitados</p>
                                </div>
                            </div>
                            <div id="partition-products-container" class="mb-4">

                            </div>
                        </div>
                        <div id="shipment-products">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col d-flex align-items-center">
                                    <p class="fw-bold">Productos embarcados</p>
                                </div>
                            </div>
                            <div id="shipment-products-container" class="mb-4">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-entry">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/shipments.js"></script>
</body>
</html>
