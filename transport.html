<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa de Transportes - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
     <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="transport-header">
            <div id="transport-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-truck-flatbed" viewBox="0 0 16 16">
                                <path d="M11.5 4a.5.5 0 0 1 .5.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-4 0 1 1 0 0 1-1-1v-1h11V4.5a.5.5 0 0 1 .5-.5M3 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2m9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2m1.732 0h.768a.5.5 0 0 0 .5-.5V8.35a.5.5 0 0 0-.11-.312l-1.48-1.85A.5.5 0 0 0 13.02 6H12v4a2 2 0 0 1 1.732 1"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Planeación de Transporte</h4>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="transport-filter pt-3 pb-3">
            <div id="transport-filter-container" class="container pt-4 pb-3">
                <div class="d-flex align-items-center ms-4 mb-4">
                    <button id="btn-prev" class="btn me-3 week-buttons">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-left" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0"/>
                        </svg>
                    </button>
                    <h5 id="weekHeader">Semana -</h5>
                    <button id="btn-next" class="btn ms-3 week-buttons">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-chevron-right" viewBox="0 0 16 16">
                            <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708"/>
                        </svg>
                    </button>
                </div>
                <div class="row ms-2 me-2">
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border">
                        <label for="year-filter" class="form-label m-2">Filtrar por Año</label>
                        <select class="form-select" id="year-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border">
                        <label for="week-filter" class="form-label m-2">Filtrar por Semana</label>
                        <select class="form-select" id="week-filter">
                            <option value="0">Todas</option>
                        </select>
                    </div>
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="client-filter" class="form-label m-2">Filtrar por Cliente</label>
                        <select class="form-select" id="client-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="status-filter" class="form-label m-2">Filtrar por Estado</label>
                        <select class="form-select" id="status-filter">
                            <option value="0">Todos</option>
                            <option value="Planeado">Planeado</option>
                            <option value="Asignado">Asignado</option>
                            <option value="En ruta">En ruta</option>
                            <option value="Entregado">Entregado</option>
                        </select>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="transport-register" class="pb-4">
            <div id="transport-table-container" class="container table-responsive p-0">
                <table id="transport-table" class="table table-hover">
                    <thead>
                        <tr class="table-light">
                            <th class="p-3 ps-4">DÍA</th>
                            <th class="p-3 ps-2">CLIENTE</th>
                            <th class="p-3 ps-2">CANTIDAD</th>
                            <th class="text-center p-3">ESTADO</th>
                            <th class="p-3 ps-2">UNIDAD</th>
                            <th class="text-center p-3">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

     <!-- Modal de asignación para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Asignar unidad de transporte</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="transport-edit-form">
                            <input type="hidden" id="edit-id-partition">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 col-lg-3 label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control" id="edit-date" disabled>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border">
                                    <label for="edit-time" class="form-label m-2">Hora</label>
                                    <input type="time" class="form-control" id="edit-time" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-oc" class="form-label m-2">Orden de compra</label>
                                    <input type="text" class="form-control" id="edit-oc" disabled>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="Planeado">Seleccione...</option>
                                        <option value="Asignado">Asignado</option>
                                        <option value="En ruta">En ruta</option>
                                        <option value="Entregado">Entregado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-unit" class="form-label m-2">Unidad</label>
                                    <select id="edit-unit" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editUnit" style="color: red;"></p>
                                </div>
                                <!-- Campos editables -->
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-box" class="form-label m-2">Caja</label>
                                    <select id="edit-box" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editBox" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-entry">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/js/pages/transport.js"></script>
</body>
</html>
