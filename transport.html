<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programa de Transportes - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar" class="d-print-none">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg d-print-none">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
     <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="transport-header">
            <div id="transport-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3 d-print-none">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-truck-flatbed" viewBox="0 0 16 16">
                                <path d="M11.5 4a.5.5 0 0 1 .5.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-4 0 1 1 0 0 1-1-1v-1h11V4.5a.5.5 0 0 1 .5-.5M3 11a1 1 0 1 0 0 2 1 1 0 0 0 0-2m9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2m1.732 0h.768a.5.5 0 0 0 .5-.5V8.35a.5.5 0 0 0-.11-.312l-1.48-1.85A.5.5 0 0 0 13.02 6H12v4a2 2 0 0 1 1.732 1"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Planeación de Transporte</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-trip" class="btn btn-primary d-flex align-items-center d-none" data-trans-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Nuevo Viaje</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="trips-form">
            
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="transport-filter pt-3 pb-3">
            <div id="transport-filter-container" class="container pt-4 pb-3">
                <div class="d-flex align-items-center ms-4 mb-4">
                    <h5 id="weekHeader">Semana -</h5>
                </div>
                <div class="row ms-2 me-2 d-print-none">
                    <div class="col-lg-3 col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="day-filter" class="form-label m-2">Filtrar por Día</label>
                        <input type="text" id="day-filter" class="form-control" placeholder="Fecha a mostrar">
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS A ASIGNAR -->
        <section id="transport-register" class="pb-4">
            <div class="container">
                <div class="row">
                    <div class="col-lg transport ps-0">
                        <h5 class="ps-2 mb-2 title">Partidas</h5>
                        <div id="partitions-table-container" class="table-responsive p-0">
                            <table id="partitions-table" class="table table-hover">
                                <thead>
                                    <tr class="table-light">
                                        <th class="p-3 text-center">HORA</th>
                                        <th class="p-3 ps-2">CLIENTE</th>
                                        <th class="p-3 ps-2">CANTIDAD</th>
                                        <th class="p-3 ps-2">DESTINO</th>
                                        <th class="text-center p-3 d-print-none d-none" data-trans-only>ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="col-lg transport pe-0">
                        <h5 class="ps-2 mb-2 title">Recolecciones</h5>
                        <div id="recolections-table-container" class="table-responsive p-0">
                            <table id="recolections-table" class="table table-hover">
                                <thead>
                                    <tr class="table-light">
                                        <th class="p-3 ps-4">HORA</th>
                                        <th class="p-3 ps-2">PROVEEDOR</th>
                                        <th class="p-3 ps-2">CANTIDAD</th>
                                        <th class="p-3 ps-2">DESTINO</th>
                                        <th class="text-center p-3 d-print-none d-none" data-trans-only>ACCIONES</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- SECCIÓN DE REGISTROS VIAJES -->
        <section id="trips-register" class="pb-4">
            <div id="trips-table-container" class="container table-responsive p-0">
                <table id="trips-table" class="table table-hover">
                    <thead>
                        <tr class="table-light">
                            <th class="p-3 ps-4">DÍA</th>
                            <th class="p-3 ps-2">TIPO</th>
                            <th class="p-3 ps-2">DISTANCIA</th>
                            <th class="p-3 ps-2">LITROS</th>
                            <th class="p-3 ps-2">COSTO</th>
                            <th class="p-3 ps-2">TAG</th>
                            <th class="text-center p-3 d-print-none">ESTADO</th>
                            <th class="p-3 ps-2">UNIDAD</th>
                            <th class="p-3 ps-2">OPERADOR</th>
                            <th class="p-3 ps-2">EVENTOS</th>
                            <th class="text-center p-3 d-print-none d-none" data-trans-only>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de asignación de viaje para cada registro -->
    <div class="modal fade" id="asign-modal" tabindex="-1" aria-labelledby="asign-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Asignar viaje al evento</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="transport-edit-form">
                            <input type="hidden" id="edit-id-register">
                            <input type="hidden" id="edit-type">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 col-lg-3 ms-auto label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control" id="edit-date" disabled>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border">
                                    <label for="edit-time" class="form-label m-2">Hora</label>
                                    <input type="time" class="form-control" id="edit-time" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-client" class="form-label m-2">Cliente / Proveedor</label>
                                    <input type="text" class="form-control" id="edit-client" disabled>
                                </div>
                                <div class="col-md-6 label-over-border">
                                    <label for="edit-destination" class="form-label m-2">Destino</label>
                                    <input type="text" class="form-control" id="edit-destination" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 col-lg-4 ms-auto label-over-border">
                                    <label for="edit-trip" class="form-label m-2">Viaje</label>
                                    <select id="edit-trip" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editTrip" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="products">
                            <p class="ms-3 p-2 ps-1 fw-bold">Productos asignados</p>
                            <div id="partition-products-container" class="mb-2">

                            </div>
                            <div id="recolection-products-container" class="mb-2">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-entry">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de edición para viajes -->
    <div class="modal fade" id="trip-modal" tabindex="-1" aria-labelledby="trip-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Asignar unidad de transporte</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="trip-edit-form">
                            <input type="hidden" id="edit-id-trip">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 col-lg-3 ms-auto label-over-border">
                                    <label for="edit-trip-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control" id="edit-trip-date" disabled>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border filter">
                                    <label for="edit-trip-time" class="form-label m-2">Hora</label>
                                    <input type="time" class="form-control" id="edit-trip-time" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-unit" class="form-label m-2">Unidad</label>
                                    <input type="text" class="form-control" id="edit-unit" disabled>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-box" class="form-label m-2">Caja</label>
                                    <input type="text" class="form-control" id="edit-box" disabled>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-operator" class="form-label m-2">Operador</label>
                                    <input type="text" class="form-control" id="edit-operator" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-distance" class="form-label m-2">Distancia</label>
                                    <input type="number" class="form-control no-arrows" id="edit-distance" placeholder="Kilometraje a recorrer">
                                    <p class="error invalid-feedback" id="error-editDistance" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-fuel" class="form-label m-2">Combustible</label>
                                    <input type="number" class="form-control no-arrows" id="edit-fuel" placeholder="Combustible a ustilizar">
                                    <p class="error invalid-feedback" id="error-editFuel" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-price" class="form-label m-2">Costo</label>
                                    <input type="number" class="form-control no-arrows" id="edit-price" placeholder="Costo total del combustible">
                                    <p class="error invalid-feedback" id="error-editPrice" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 ms-auto label-over-border">
                                    <label for="edit-tag" class="form-label m-2">Tag</label>
                                    <input type="number" class="form-control no-arrows" id="edit-tag" placeholder="Costo del Tag">
                                    <p class="error invalid-feedback" id="error-editTag" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="Planeado">Seleccione...</option>
                                        <option value="Asignado">Asignado</option>
                                        <option value="En ruta">En ruta</option>
                                        <option value="Completado">Completado</option>
                                        <option value="Cancelado">Cancelado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="events">
                            <div id="partition-container" class="mb-2">

                            </div>
                            <div id="recolection-container" class="mb-2">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-trip">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer" class="d-print-none">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/transport.js"></script>
</body>
</html>
