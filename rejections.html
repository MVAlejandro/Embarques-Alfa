<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro de Rechazos - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
     <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="rejections-header">
            <div id="rejections-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-graph-down-arrow" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm10 11.5a.5.5 0 0 0 .5.5h4a.5.5 0 0 0 .5-.5v-4a.5.5 0 0 0-1 0v2.6l-3.613-4.417a.5.5 0 0 0-.74-.037L7.06 8.233 3.404 3.206a.5.5 0 0 0-.808.588l4 5.5a.5.5 0 0 0 .758.06l2.609-2.61L13.445 11H10.5a.5.5 0 0 0-.5.5"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Registro de Rechazos</h4>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="rejections-filter pt-3 pb-3">
            <div id="rejections-filter-container" class="container pt-4 pb-3">
                <div class="d-flex align-items-center ms-4 mb-4">
                    <h5 id="weekHeader">Semana -</h5>
                </div>
                <div class="row ms-2 me-2">
                    <div class="col-md-3 col-lg d-flex align-items-center label-over-border">
                        <label for="day-filter" class="form-label m-2">Filtrar por Día</label>
                        <input type="text" id="day-filter" class="form-control" placeholder="Fecha a mostrar">
                    </div>
                    <div class="col-md-3 col-lg d-flex align-items-center label-over-border">
                        <label for="client-filter" class="form-label m-2">Filtrar por Cliente</label>
                        <input id="client-filter" class="form-control" type="search" placeholder="Buscar cliente..." aria-label="Search" autocomplete="off"/>
                    </div>
                    <div class="col-md-3 col-lg d-flex align-items-center label-over-border">
                        <label for="product-filter" class="form-label m-2">Filtrar por Producto</label>
                        <select class="form-select" id="product-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <div id="rejections-total-container" class="container py-2">
            
        </div>

        <section id="rejections-register" class="pb-4">
            <div id="rejections-table-container" class="container table-responsive p-0">
                <table id="rejections-table" class="table table-hover">
                    <thead>
                        <tr class="table-light">
                            <th class="px-3 py-2 ps-3">FECHA</th>
                            <th class="px-3 py-2">OC</th>
                            <th class="px-3 py-2">CLIENTE</th>
                            <th class="px-3 py-2">CANTIDAD</th>
                            <th class="text-center px-3 py-2">ESTADO</th>
                            <th class="px-3 py-2">FACTURA</th>
                            <th class="text-center px-3 py-2 d-none" data-vent-only data-dir-only>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Actualizar estado de partida</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="rejections-edit-form">
                            <input type="hidden" id="edit-id-partition">
                            <input type="hidden" id="edit-id-order">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-6 col-lg-3 ms-auto label-over-border">
                                    <label for="edit-date" class="form-label m-2">Fecha</label>
                                    <input type="date" class="form-control" id="edit-date">
                                    <p class="error invalid-feedback" id="error-editDate" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border">
                                    <label for="edit-time" class="form-label m-2">Hora</label>
                                    <input type="time" class="form-control" id="edit-time">
                                    <p class="error invalid-feedback" id="error-editTime" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-12 col-lg-6 label-over-border">
                                    <label for="edit-destination" class="form-label m-2">Destino</label>
                                    <input type="text" class="form-control" id="edit-destination">
                                    <p class="error invalid-feedback" id="error-editDestination" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border filter">
                                    <label for="edit-oc" class="form-label m-2">Orden de compra</label>
                                    <input type="text" class="form-control" id="edit-oc" disabled>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border filter">
                                    <label for="edit-contract" class="form-label m-2">Contrato</label>
                                    <input type="text" class="form-control" id="edit-contract" disabled>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-8 label-over-border">
                                    <label for="edit-observations" class="form-label m-2">Observaciones</label>
                                    <input type="text" class="form-control" id="edit-observations">
                                    <p class="error invalid-feedback" id="error-editObservations" style="color: red;"></p>
                                </div>
                                <div class="col-md-4 label-over-border">
                                    <label for="edit-status" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="Pendiente">Seleccione..</option>
                                        <option value="Planeado">Planeado</option>
                                        <option value="En proceso" class="d-none">En proceso</option>
                                        <option value="PT parcial" class="d-none">PT parcial</option>
                                        <option value="En secado" class="d-none">En secado</option>
                                        <option value="Terminado" class="d-none">Terminado</option>
                                        <option value="Proyectado">Proyectado</option>
                                        <option value="Cancelado">Cancelado</option>
                                        <option value="Reprogramado" class="d-none">Reprogramado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="partition-products">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col d-flex align-items-center">
                                    <p class="fw-bold">Productos asignados</p>
                                </div>
                            </div>
                            <div id="partition-products-container" class="mb-4">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button type="button" class="btn btn-primary" id="btn-edit-entry">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="/src/js/pages/rejections.js"></script>
</body>
</html>
