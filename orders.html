<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Órdenes de compra - Pallets Alfa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!-- BARRA DE RELLENO SUPERIOR -->
    <div id="top-bar">

    </div>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav id="site-navbar" class="navbar navbar-expand-lg">

    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- SECCIÓN DEL ENCABEZADO -->
        <section id="orders-header">
            <div id="orders-header-container" class="container-fluid p-3">
                <div class="row">
                    <div class="col-8 col-md-9 col-lg-10 d-flex align-items-center">
                        <div class="icon-square ms-3 me-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-cart3" viewBox="0 0 16 16">
                                <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l.84 4.479 9.144-.459L13.89 4zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/>
                            </svg>
                        </div>
                        <h4 class="fw-bold">Gestión de Contratos</h4>
                    </div>
                    <div class="col-4 col-md-3 col-lg-2 d-flex align-items-center">
                        <button id="btn-add-order" class="btn btn-primary d-flex align-items-center d-none" data-vent-only>
                            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-plus" viewBox="0 0 16 16">
                                <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4"/>
                            </svg>
                            <p class="ps-1">Nuevo Contrato</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE FORMULARIO PARA AGREGAR REGISTRO -->
        <section id="orders-form">
            
        </section>

        <!-- SECCIÓN DE FILTROS -->
        <section id="orders-filter">
            <div class="container pt-3 pb-3">
                <h5>Contratos Existentes</h5>
            </div>
            <div id="orders-filter-container" class="container pt-4 pb-3">
                <div class="row ms-2 me-2">
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border">
                        <label for="client-filter" class="form-label m-2">Filtrar por Cliente</label>
                        <select class="form-select" id="client-filter">
                            <option value="0">Todos</option>
                        </select>
                    </div>
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border">
                        <label for="status-filter" class="form-label m-2">Filtrar por Estado</label>
                        <select class="form-select" id="status-filter">
                            <option value="0">Todas</option>
                            <option value="Vigente">Vigente</option>
                            <option value="Terminado">Terminado</option>
                        </select>
                    </div>
                    <div class="col-lg col-md-6 d-flex align-items-center label-over-border filter">
                        <label for="search-filter" class="form-label m-2">Buscar por OC</label>    
                        <input id="search-filter" class="form-control" type="search" placeholder="Buscar..." aria-label="Search"/>
                    </div>
                    <div class="col-md d-flex align-items-center justify-content-end">
                        <button id="filter-btn" class="btn btn-primary d-flex align-items-center ps-3 pe-3">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                            </svg>
                            <p class="ps-2">Filtrar</p>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN DE REGISTROS -->
        <section id="orders-register">
            <div id="orders-table-container" class="container table-responsive p-0">
                <table id="orders-table" class="table table-hover align-middle">
                    <thead>
                        <tr class="table-light">
                            <th class="p-3 ps-4"># ORDEN</th>
                            <th class="p-3">CONTRATO</th>
                            <th class="p-3">CLIENTE</th>
                            <th class="p-3">CREACIÓN</th>
                            <th class="p-3">CLAVE</th>
                            <th class="text-center p-3">ESTADO</th>
                            <th class="d-none" data-vent-only></th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </section>

        <!-- SECCIÓN DE PAGINACIÓN -->
        <section id="orders-pages" class="pb-4">
            <div id="orders-pages-container" class="container pt-3 pb-3">
                <div class="row ms-2 align-items-center">
                    <div class="col-6 col-lg-9">
                        <p id="orders-pages-results"></p>
                    </div>
                    <div class="col-6 col-lg-3">
                        <nav aria-label="Page navigation example">
                            <ul class="pagination mb-0">
                                <!-- Los botones se llenan dinámicamente desde JS -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal de edición para cada registro -->
    <div class="modal fade" id="edit-modal" tabindex="-1" aria-labelledby="edit-modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content pt-3 pb-3">
                <div class="modal-header">
                    <div class="row">
                        <div class="col d-flex align-items-center">
                            <div class="ms-4 me-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16" style="color:var(--primary)">
                                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                                </svg>
                            </div>
                            <h5 class="modal-title" id="edit-modalLabel">Editar orden de compra</h5>
                        </div>
                    </div>
                    <button type="button" class="btn-close me-3" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="container">
                        <form id="order-edit-form">
                            <input type="hidden" id="edit-id-order">
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-4 ms-auto label-over-border">
                                    <label for="edit-date" class="form-label m-2">Creación</label>
                                    <input type="text" class="form-control" id="edit-date" disabled>
                                    <p class="error invalid-feedback" id="error-editDate" style="color: red;"></p>
                                </div>
                            </div>
                            <!-- Campos editables -->
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                <div class="col-md-12 col-lg-6 label-over-border">
                                    <label for="edit-client" class="form-label m-2">Cliente</label>
                                    <input type="text" class="form-control" id="edit-client" disabled>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border filter">
                                    <label for="edit-oc" class="form-label m-2">Orden de compra</label>
                                    <input type="text" class="form-control" id="edit-oc">
                                    <p class="error invalid-feedback" id="error-editOc" style="color: red;"></p>
                                </div>
                                <div class="col-md-6 col-lg-3 label-over-border filter">
                                    <label for="edit-contract" class="form-label m-2">Contrato</label>
                                    <input type="text" class="form-control" id="edit-contract">
                                    <p class="error invalid-feedback" id="error-editContract" style="color: red;"></p>
                                </div>
                            </div>
                            <div class="row ms-2 me-2 pt-3 pb-3">
                                
                                <div class="col-md-6 col-lg-4 ms-auto label-over-border">
                                    <label for="edit-client" class="form-label m-2">Estado</label>
                                    <select id="edit-status" class="form-select" aria-label="Default select example">
                                        <option value="0">Seleccione...</option>
                                        <option value="Vigente">Vigente</option>
                                        <option value="Terminado">Terminado</option>
                                    </select>
                                    <p class="error invalid-feedback" id="error-editStatus" style="color: red;"></p>
                                </div>
                            </div>
                        </form>
                        <div id="order-products">
                            <div class="row ms-2 me-2 pt-2 pb-2">
                                <div class="col-6 col-md-7 col-lg-9 d-flex align-items-center">
                                    <p class="fw-bold">Productos asignados</p>
                                </div>
                                <div class="col-6 col-md-5 col-lg-3 d-flex align-items-center justify-content-end">
                                    <button id="btn-add-product" type="button" class="btn btn-sm btn-primary">+ Agregar Producto</button>
                                </div>
                            </div>
                            <div id="order-products-container" class="mb-4">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer me-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    <button id="btn-edit-entry" class="btn btn-primary">Guardar cambios</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer id="site-footer">

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="module" src="/src/js/pages/orders.js"></script>
</body>
</html>
